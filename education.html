<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Education | Lei Ai</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body {
            height: 100%;
            font-family: "Times New Roman", serif;
            color: #111;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
        }
        /* 统一深蓝配色 */
        .deep-blue {
            color: #002E6D;
        }
        .deep-blue-bg {
            background-color: #002E6D;
        }
        /* 顶部通栏深蓝条 */
        .top-bar {
            width: 100%;
            height: 60px;
        }
        /* 主体内容自动填充剩余高度 */
        .main-content {
            flex-grow: 1;
            max-width: 900px;
            margin: 60px auto;
            padding: 0 40px;
        }
        h1 {
            font-size: 34px;
            margin-bottom: 50px;
        }
        .edu-item {
            margin: 30px 0;
            font-size: 19px;
            line-height: 1.8;
        }
        /* 返回首页链接 */
        .back-home {
            margin-top: 70px;
            font-size: 18px;
        }
        .back-home a {
            text-decoration: none;
            font-weight: bold;
        }
        .back-home a:hover {
            text-decoration: underline;
        }
        /* 底部区域固定页面最底端 */
        .bottom-area {
            margin-top: auto;
        }
        .bottom-divider {
            width: 100%;
            height: 4px;
        }
        .contact-footer {
            padding: 20px 10px 30px;
            font-size: 16px;
            text-align: center;
        }
        .contact-footer a {
            text-decoration: none;
        }
        .contact-footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <!-- 顶部深蓝色通栏，和首页保持一致 -->
    <div class="top-bar deep-blue-bg"></div>

    <div class="main-content">
        <h1 class="deep-blue">教育经历</h1>

        <!-- 中文教育信息 -->
        <div class="edu-item">
            <strong>2026至今</strong><br>
            清华大学教育学院<br>
            教育学原理专业<br>
            博士研究生
        </div>

        <div class="edu-item">
            <strong>2023-2026</strong><br>
            北京师范大学教育学部<br>
            教育学原理专业<br>
            教育学硕士
        </div>

        <div class="edu-item">
            <strong>2019-2023</strong><br>
            中南大学马克思主义学院<br>
            思想政治教育专业<br>
            法学学士
        </div>

        <!-- 返回个人首页 -->
        <div class="back-home">
            <a href="index.html" class="deep-blue">← 返回主页</a>
        </div>
    </div>

    <!-- 底部分割线+邮箱，沉在页面最下方 -->
    <div class="bottom-area">
        <div class="bottom-divider deep-blue-bg"></div>
        <div class="contact-footer">
            <p>邮箱：<a href="mailto:leiai@mail.bnu.edu.cn" class="deep-blue">leiai@mail.bnu.edu.cn</a></p>
        </div>
    </div>
</body>
</html>
