<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>教育经历 | Lei Ai</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body {
            height: 100%;
            font-family: "Times New Roman", serif;
            color: #111;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
        }
        /* 统一深蓝配色 */
        .deep-blue {
            color: #002E6D;
        }
        .deep-blue-bg {
            background-color: #002E6D;
        }
        /* 顶部导航栏：高度60px 和首页完全一致，左右分布 */
        .top-bar {
            width: 100%;
            height: 60px;
            background-color: #002E6D;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 30px;
        }
        /* 左侧标题：无斜体，仿参考页标准衬线字体 */
        .page-title {
            font-size: 46px;
            font-family: "Times New Roman", serif;
            font-style: normal;
            color: #ffffff;
        }
        /* 右侧Home链接：无斜体，同款字体 */
        .home-link {
            font-size: 26px;
            font-family: "Times New Roman", serif;
            font-style: normal;
            color: #ffffff;
            text-decoration: none;
        }
        .home-link:hover {
            text-decoration: underline;
        }
        /* 主体内容自动填充剩余高度 */
        .main-content {
            flex-grow: 1;
            max-width: 900px;
            margin: 60px auto;
            padding: 0 40px;
        }
        .edu-item {
            margin: 30px 0;
            font-size: 19px;
            line-height: 1.8;
        }
        /* 底部区域固定页面最底端 */
        .bottom-area {
            margin-top: auto;
        }
        .bottom-divider {
            width: 100%;
            height: 4px;
        }
        .contact-footer {
            padding: 20px 10px 30px;
            font-size: 16px;
            text-align: center;
        }
        .contact-footer a {
            text-decoration: none;
        }
        .contact-footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <!-- 顶部深蓝栏：左标题 右Home链接 -->
    <div class="top-bar deep-blue-bg">
        <div class="page-title">Education</div>
        <a href="index.html" class="home-link">Home</a>
    </div>

    <div class="main-content">
        <!-- 中文教育信息 -->
        <div class="edu-item">
            <strong>2026至今</strong><br>
            清华大学教育学院<br>
            教育学原理专业<br>
            博士研究生
        </div>

        <div class="edu-item">
            <strong>2023-2026</strong><br>
            北京师范大学教育学部<br>
            教育学原理专业<br>
            教育学硕士
        </div>

        <div class="edu-item">
            <strong>2019-2023</strong><br>
            中南大学马克思主义学院<br>
            思想政治教育专业<br>
            法学学士
        </div>
    </div>

    <!-- 底部分割线+邮箱，沉在页面最下方 -->
    <div class="bottom-area">
        <div class="bottom-divider deep-blue-bg"></div>
        <div class="contact-footer">
            <p>Email：<a href="mailto:leiai@mail.bnu.edu.cn" class="deep-blue">leiai@mail.bnu.edu.cn</a></p>
        </div>
    </div>
</body>
</html>
