<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>期刊论文 | Lei Ai</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body {
            height: 100%;
            font-family: "SimSun", "宋体", serif;
            color: #111;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
        }
        /* 全局深蓝配色 */
        .deep-blue {
            color: #002E6D;
        }
        .deep-blue-bg {
            background-color: #002E6D;
        }
        /* 顶部通栏 高度60px 和首页统一 */
        .top-bar {
            width: 100%;
            height: 60px;
            background-color: #002E6D;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 30px;
        }
        /* 左侧标题 Article */
        .page-title {
            font-size: 46px;
            font-family: "Times New Roman", serif;
            font-style: normal;
            color: #ffffff;
        }
        /* 中间导航容器 竖线分隔 */
        .nav-middle {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .divider {
            color: #fff;
            font-size: 20px;
        }
        .nav-item {
            font-size: 20px;
            font-family: "Times New Roman", serif;
            font-style: normal;
            color: #ffffff;
            text-decoration: none;
        }
        /* 当前页面加粗高亮 */
        .nav-active {
            font-weight: bold;
        }
        .nav-item:hover {
            text-decoration: underline;
        }
        /* 右侧Home链接 */
        .home-link {
            font-size: 26px;
            font-family: "Times New Roman", serif;
            font-style: normal;
            color: #ffffff;
            text-decoration: none;
        }
        .home-link:hover {
            text-decoration: underline;
        }
        /* 正文区域：左右留白约6厘米，整体收窄 */
        .main-content {
            flex-grow: 1;
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 6rem;
        }
        /* 单栏论文列表 */
        .paper-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 18px;
            width: 100%;
        }
        /* 论文卡片：蓝色色块高度减少，更短更稳 */
        .paper-card {
            background-color: #f0f4f8;
            border: 1px solid #e6edf3;
            display: flex;
            align-items: flex-start;
            padding: 14px 16px;
            gap: 18px;
            width: 100%;
        }
        /* 期刊封面图片统一相同大小 */
        .journal-cover {
            width: 82px;
            height: 110px;
            flex-shrink: 0;
            object-fit: cover;
            border: 1px solid #ddd;
        }
        /* 论文文字信息区域 */
        .paper-info {
            flex-grow: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 110px;
            padding-top: 2px;
            padding-bottom: 2px;
        }
        /* 第一行标题：整体缩小 */
        .paper-title-link {
            font-family: "SimHei", "黑体", sans-serif;
            font-size: 18px;
            line-height: 1.45;
            text-decoration: none;
            color: #111;
            font-weight: bold;
            display: block;
        }
        .paper-title-link:hover {
            text-decoration: underline;
            color: #002E6D;
        }
        /* 作者姓名：中等字号，次于标题 */
        .paper-author {
            font-size: 14px;
            margin-top: 14px;
            color: #222;
        }
        /* 期刊发表信息：最小字号 */
        .paper-source {
            font-size: 12px;
            margin-top: 4px;
            line-height: 1.6;
            color: #333;
        }
        /* 右侧年份 */
        .paper-year {
            font-size: 18px;
            font-weight: 600;
            flex-shrink: 0;
            color: #002E6D;
            margin-top: 2px;
        }
        /* 底部固定区域 */
        .bottom-area {
            margin-top: auto;
        }
        .bottom-divider {
            width: 100%;
            height: 4px;
        }
        .contact-footer {
            padding: 20px 10px 30px;
            font-size: 16px;
            text-align: center;
        }
        .contact-footer a {
            text-decoration: none;
            color: #002E6D;
        }
        .contact-footer a:hover {
            text-decoration: underline;
        }
        /* 小屏幕适配 */
        @media (max-width: 768px) {
            .page-title {
                font-size: 32px;
            }
            .nav-item {
                font-size: 16px;
            }
            .home-link {
                font-size: 20px;
            }
            .main-content {
                max-width: 100%;
                padding: 0 2rem;
                margin: 20px auto;
            }
            .paper-title-link {
                font-size: 16px;
            }
            .paper-author {
                font-size: 13px;
            }
            .paper-source {
                font-size: 11px;
            }
            .journal-cover {
                width: 70px;
                height: 94px;
            }
            .paper-info {
                min-height: 94px;
            }
        }
    </style>
</head>
<body>

        <div class="nav-middle">

    </div>

    <!-- 底部蓝线+Email -->
    <div class="bottom-area">
