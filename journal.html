            margin: 60px auto;
            padding: 0 40px;
        }
        .section-title {

            margin-bottom: 40px;
        }
        .paper-item {
            font-size: 18px;
            line-height: 1.8;
            margin: 24px 0;
        }

        .bottom-area {
