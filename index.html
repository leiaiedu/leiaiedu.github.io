<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Name | Academic Homepage</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: Georgia, "Times New Roman", serif;
            /* 关键：删除max-width，页面直接铺满浏览器全屏 */
            color: #111;
            background-color: #ffffff;
        }
        /* 顶部紫色通栏 */
        .top-bar {
            width: 100%;
            height: 60px;
            background-color: #3a1c71;
        }
        /* 主内容容器：左右横向铺满整屏 */
        .main-container {
            display: flex;
            justify-content: space-between;
            padding: 40px 30px;
            min-height: 78vh;
        }
        /* 左侧图片+姓名区域 */
        .left-block {
            width: 28%;
        }
        .cover-img {
            width: 100%;
            display: block;
        }
        .name-text {
            margin-top: 30px;
            font-size: 32px;
            color: #997744;
            letter-spacing: 1px;
        }
        /* 右侧导航栏 完全复刻原版黄色大写居中 */
        .nav-block {
            width: 25%;
            padding-top: 40px;
        }
        .nav-list {
            list-style: none;
            text-align: center;
        }
        .nav-list li {
            margin: 24px 0;
        }
        .nav-list a {
            font-size: 20px;
            color: #d4aa00;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .nav-list a:hover {
            text-decoration: underline;
        }
        /* 底部紫色分割线 */
        .divider-line {
            width: 100%;
            height: 4px;
            background-color: #3a1c71;
        }
        /* 最底部全屏联系信息区域 */
        .contact-footer {
            padding: 15px 10px;
            font-size: 16px;
        }
        .contact-footer a {
            color: #d4aa00;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <!-- 顶部全屏紫色条 -->
    <div class="top-bar"></div>

    <!-- 主体左右分栏，铺满屏幕 -->
    <div class="main-container">
        <!-- 左侧：封面图 + 姓名 -->
        <div class="left-block">
            <!-- 替换成你的图片，无图可以删掉img标签 -->
            <img class="cover-img" src="cover.jpg" alt="cover">
            <p class="name-text">your full name</p>
        </div>

        <!-- 右侧竖排导航 -->
        <div class="nav-block">
            <ul class="nav-list">
                <li><a href="biography.html">Biography</a></li>
                <li><a href="education.html">Education</a></li>
                <li><a href="article.html">Article</a></li>
                <li><a href="practice.html">Practice</a></li>
                <li><a href="hobby.html">Hobby</a></li>
            </ul>
        </div>
    </div>

    <!-- 底部分割紫线 -->
    <div class="divider-line"></div>

    <!-- 全屏宽度联系方式 -->
    <div class="contact-footer">
        <p><strong>Contact Information:</strong></p>
        <p>Address: 你的办公地址</p>
        <p>Office Phone: 电话 | Fax: 传真</p>
        <p>Email to: <a href="mailto:xxx@xxx.edu">xxx@xxx.edu</a></p>
    </div>
    <!-- 底部第二条紫线 -->
    <div class="divider-line"></div>
</body>
</html>
