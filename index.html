<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lei Ai | Academic Homepage</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: "Times New Roman", serif;
            color: #111;
            background-color: #ffffff;
        }
        /* 统一深蓝配色 */
        .deep-blue {
            color: #002E6D;
        }
        .deep-blue-bg {
            background-color: #002E6D;
        }
        /* 顶部通栏深蓝条 */
        .top-bar {
            width: 100%;
            height: 60px;
        }
        /* 主体左右布局 */
        .main-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 40px 5%;
            min-height: 78vh;
        }
        /* 左侧图片+姓名区域 */
        .left-block {
            width: 28%;
        }
        .cover-img {
            width: 100%;
            display: block;
            margin-bottom: 30px;
        }
        /* 姓名居中，解决靠左问题 */
        .name-text {
            font-size: 32px;
            letter-spacing: 1px;
            text-align: center;
        }
        /* 右侧导航加宽，向左靠拢，缩小中间空白 */
        .nav-block {
            width: 32%;
        }
        .nav-list {
            list-style: none;
            text-align: center;
        }
        .nav-list li {
            margin: 32px 0;
        }
        .nav-list a {
            font-family: "Times New Roman", serif;
            font-size: 20px;
            font-weight: bold;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .nav-list a:hover {
            text-decoration: underline;
        }
        /* 底部唯一分割蓝线 */
        .bottom-divider {
            width: 100%;
            height: 4px;
        }
        /* 邮箱移到分割线下方，居中展示 */
        .contact-footer {
            padding: 20px 10px;
            font-size: 16px;
            text-align: center;
        }
        .contact-footer a {
            text-decoration: none;
        }
        .contact-footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <!-- 顶部深蓝色通栏 -->
    <div class="top-bar deep-blue-bg"></div>

    <!-- 主体左右分栏 -->
    <div class="main-container">
        <!-- 左侧：毕业照片 + 居中姓名 -->
        <div class="left-block">
            <img class="cover-img" src="cover.jpg" alt="Graduation Photo">
            <p class="name-text deep-blue">Lei Ai</p>
        </div>

        <!-- 右侧导航（加宽左移，减少中间空白） -->
        <div class="nav-block">
            <ul class="nav-list">
                <li><a href="biography.html" class="deep-blue">Biography</a></li>
                <li><a href="education.html" class="deep-blue">Education</a></li>
                <li><a href="article.html" class="deep-blue">Article</a></li>
                <li><a href="practice.html" class="deep-blue">Practice</a></li>
                <li><a href="hobby.html" class="deep-blue">Hobby</a></li>
            </ul>
        </div>
    </div>

    <!-- 页面底部深蓝分割线 -->
    <div class="bottom-divider deep-blue-bg"></div>

    <!-- 邮箱放到分割线下方，完成需求1 -->
    <div class="contact-footer">
        <p>Email: <a href="mailto:leiai@mail.bnu.edu.cn" class="deep-blue">leiai@mail.bnu.edu.cn</a></p>
    </div>
</body>
</html>
