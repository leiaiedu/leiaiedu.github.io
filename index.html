<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lei Ai | Academic Homepage</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: "Times New Roman", serif;
            color: #111;
            background-color: #ffffff;
        }
        /* 更深的北师大深蓝 #002E6D */
        .deep-blue {
            color: #002E6D;
        }
        .deep-blue-bg {
            background-color: #002E6D;
        }
        /* 顶部通栏深蓝条 */
        .top-bar {
            width: 100%;
            height: 60px;
        }
        /* 主体全屏左右布局，垂直居中 */
        .main-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 40px 30px;
            min-height: 78vh;
        }
        /* 左侧图片+姓名区域 */
        .left-block {
            width: 28%;
        }
        .cover-img {
            width: 100%;
            display: block;
            margin-bottom: 30px;
        }
        .name-text {
            font-size: 32px;
            letter-spacing: 1px;
        }
        /* 右侧导航栏：Times New Roman + 加粗 + 大行距 */
        .nav-block {
            width: 25%;
        }
        .nav-list {
            list-style: none;
            text-align: center;
        }
        .nav-list li {
            margin: 32px 0;
        }
        .nav-list a {
            font-family: "Times New Roman", serif;
            font-size: 20px;
            font-weight: bold;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .nav-list a:hover {
            text-decoration: underline;
        }
        /* 唯一底部分割深蓝条，放在页面最底部 */
        .bottom-divider {
            width: 100%;
            height: 4px;
            margin-top: 40px;
        }
        /* 底部邮箱区域居中 */
        .contact-footer {
            padding: 15px 10px;
            font-size: 16px;
            text-align: center;
        }
        .contact-footer a {
            text-decoration: none;
        }
        .contact-footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <!-- 顶部全屏深蓝色通栏 -->
    <div class="top-bar deep-blue-bg"></div>

    <!-- 主体左右分栏，垂直整体居中 -->
    <div class="main-container">
        <!-- 左侧：封面图片 + 姓名（复刻阿伯特主页图片布局） -->
        <div class="left-block">
            <!-- 上传图片命名为 cover.jpg 放到仓库根目录即可显示 -->
            <img class="cover-img" src="cover.jpg" alt="Book Cover">
            <p class="name-text deep-blue">Lei Ai</p>
        </div>

        <!-- 右侧竖排加粗导航 -->
        <div class="nav-block">
            <ul class="nav-list">
                <li><a href="biography.html" class="deep-blue">Biography</a></li>
                <li><a href="education.html" class="deep-blue">Education</a></li>
                <li><a href="article.html" class="deep-blue">Article</a></li>
                <li><a href="practice.html" class="deep-blue">Practice</a></li>
                <li><a href="hobby.html" class="deep-blue">Hobby</a></li>
            </ul>
        </div>
    </div>

    <!-- 底部邮箱 -->
    <div class="contact-footer">
        <p>Email: <a href="mailto:leiai@mail.bnu.edu.cn" class="deep-blue">leiai@mail.bnu.edu.cn</a></p>
    </div>

    <!-- 仅保留1根深蓝分割条，放在页面最底端，消除悬空感 -->
    <div class="bottom-divider deep-blue-bg"></div>
</body>
</html>
