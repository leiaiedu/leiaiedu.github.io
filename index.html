<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lei Ai | Academic Homepage</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        /* 关键：页面整体占满可视屏幕高度 */
        html, body {
            height: 100%;
            font-family: "Times New Roman", serif;
            color: #111;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
        }
        /* 统一深蓝配色 */
        .deep-blue {
            color: #002E6D;
        }
        .deep-blue-bg {
            background-color: #002E6D;
        }
        /* 顶部通栏深蓝条 */
        .top-bar {
            width: 100%;
            height: 60px;
        }
        /* 主体区域自动填充剩余高度，把底部内容压到最下面 */
        .main-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 40px 5%;
            flex-grow: 1; /* 核心属性，撑开中间空白 */
        }
        /* 左侧图片+居中姓名 */
        .left-block {
            width: 28%;
        }
        .cover-img {
            width: 100%;
            display: block;
            margin-bottom: 30px;
        }
        .name-text {
            font-size: 32px;
            letter-spacing: 1px;
            text-align: center;
        }
        /* 右侧导航左移加宽 */
        .nav-block {
            width: 32%;
        }
        .nav-list {
            list-style: none;
            text-align: center;
        }
        .nav-list li {
            margin: 32px 0;
        }
        .nav-list a {
            font-family: "Times New Roman", serif;
            font-size: 20px;
            font-weight: bold;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #002E6D; /* 统一深蓝色，无紫色 */
        }
        .nav-list a:hover {
            text-decoration: underline;
        }
        /* 底部分割线 + 邮箱 固定在页面最底端 */
        .bottom-area {
            margin-top: auto;
        }
        .bottom-divider {
            width: 100%;
            height: 4px;
        }
        .contact-footer {
            padding: 20px 10px 30px;
            font-size: 16px;
            text-align: center;
        }
        .contact-footer a {
            text-decoration: none;
            color: #002E6D;
        }
        .contact-footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <!-- 顶部深蓝色通栏 -->
    <div class="top-bar deep-blue-bg"></div>

    <!-- 主体中间内容区 -->
    <div class="main-container">
        <div class="left-block">
            <img class="cover-img" src="cover.jpg" alt="Graduation Photo">
            <p class="name-text deep-blue">Lei Ai</p>
        </div>
        <div class="nav-block">
            <ul class="nav-list">
                <li><a href="biography.html">Biography</a></li>
                <li><a href="education.html">Education</a></li>
                <!-- ARTICLE 点击直接跳转到期刊论文页面 journal.html -->
                <li><a href="journal.html">Article</a></li>
                <li><a href="practice.html">Practice</a></li>
                <li><a href="hobby.html">Hobby</a></li>
                <!-- HOBBY 点击直接跳转到徒步页面 trek.html -->
                <li><a href="hiking.html">Hobby</a></li>
            </ul>
        </div>
    </div>

    <!-- 底部整块区域 -->
    <div class="bottom-area">
        <div class="bottom-divider deep-blue-bg"></div>
        <div class="contact-footer">
            <p>Email: <a href="mailto:leiai@mail.bnu.edu.cn">leiai@mail.bnu.edu.cn</a></p>
        </div>
    </div>
</body>
</html>
