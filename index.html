<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lei Ai | Academic Homepage</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: "Times New Roman", serif;
            color: #111;
            background-color: #ffffff;
        }
        /* 北师大校徽标准蓝色 #004098 */
        .bnublue {
            color: #004098;
        }
        .bnublue-bg {
            background-color: #004098;
        }
        /* 顶部通栏蓝条 */
        .top-bar {
            width: 100%;
            height: 60px;
        }
        /* 主体全屏左右布局 */
        .main-container {
            display: flex;
            justify-content: space-between;
            align-items: center; /* 左右板块垂直整体居中，解决导航偏上问题 */
            padding: 40px 30px;
            min-height: 78vh;
        }
        /* 左侧姓名区域 */
        .left-block {
            width: 28%;
        }
        .name-text {
            font-size: 32px;
            letter-spacing: 1px;
        }
        /* 右侧导航栏 */
        .nav-block {
            width: 25%;
        }
        .nav-list {
            list-style: none;
            text-align: center;
        }
        .nav-list li {
            margin: 32px 0; /* 加大行间距 */
        }
        .nav-list a {
            font-size: 20px;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .nav-list a:hover {
            text-decoration: underline;
        }
        /* 底部分割蓝线 */
        .divider-line {
            width: 100%;
            height: 4px;
        }
        /* 底部邮箱区域 */
        .contact-footer {
            padding: 15px 10px;
            font-size: 16px;
            text-align: center;
        }
        .contact-footer a {
            text-decoration: none;
        }
        .contact-footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <!-- 顶部全屏蓝色通栏 -->
    <div class="top-bar bnublue-bg"></div>

    <!-- 主体左右分栏，垂直整体居中 -->
    <div class="main-container">
        <!-- 左侧姓名 -->
        <div class="left-block">
            <p class="name-text bnublue">Lei Ai</p>
        </div>

        <!-- 右侧竖排居中导航 -->
        <div class="nav-block">
            <ul class="nav-list">
                <li><a href="biography.html" class="bnublue">Biography</a></li>
                <li><a href="education.html" class="bnublue">Education</a></li>
                <li><a href="article.html" class="bnublue">Article</a></li>
                <li><a href="practice.html" class="bnublue">Practice</a></li>
                <li><a href="hobby.html" class="bnublue">Hobby</a></li>
            </ul>
        </div>
    </div>

    <!-- 第一条蓝色分割线 -->
    <div class="divider-line bnublue-bg"></div>

    <!-- 底部仅保留邮箱 -->
    <div class="contact-footer">
        <p>Email: <a href="mailto:leiai@mail.bnu.edu.cn" class="bnublue">leiai@mail.bnu.edu.cn</a></p>
    </div>

    <!-- 第二条蓝色分割线 -->
    <div class="divider-line bnublue-bg"></div>
</body>
</html>
