<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>徒步记录 | Lei Ai</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body {
            min-height: 100vh;
            font-family: "Times New Roman", "SimSun", serif;
            color: #111;
            background-color: #ffffff;
            display: flex;
        }
        /* 全局深蓝配色 北师大校徽蓝 */
        .deep-blue { color: #002E6D; }
        .deep-blue-bg { background-color: #002E6D; }
        /* 顶部通栏固定60px高度 */
        .top-bar {
            width: 100%;
            height: 60px;
            background-color: #002E6D;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 32px;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 99;
        }
        .page-title {
            font-size: 24px;
            color: #fff;
            font-weight: normal;
        }
        .nav-middle {
            display: flex;
            gap: 20px;
            align-items: center;
        }
        .divider { color: #fff; font-size: 20px; }
        .nav-item {
            color: #fff;
            font-size: 19px;
            text-decoration: none;
        }
        .nav-active { font-weight: bold; }
        .home-link {
            color: #fff;
            font-size: 22px;
            text-decoration: none;
        }
        /* 页面主体容器 避让顶部导航 */
        .page-wrap {
            margin-top: 60px;
            display: flex;
            width: 100%;
        }
        /* 右侧年份竖排时间轴导航 */
        .year-sidebar {
            width: 90px;
            padding: 60px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 48px;
            border-left: 1px solid #002E6D;
            flex-shrink: 0;
        }
        .year-item {
            font-size: 28px;
            text-decoration: none;
            color: #999;
        }
        .year-active {
            color: #002E6D;
            font-weight: bold;
        }
        /* 中间内容主区域 */
        .main-content {
            flex: 1;
            padding: 60px 70px;
        }
        /* 单条徒步卡片容器 */
        .hiking-card {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 40px;
            margin-bottom: 80px;
        }
        /* 左侧地图轨迹图 */
        .map-box {
            width: 100%;
        }
        .map-box img {
            width: 100%;
            object-fit: cover;
        }
        /* 徒步文字信息区 层级错落排版 */
        .text-area {
            padding-top: 12px;
        }
        .place-name {
            font-size: 46px;
            color: #002E6D;
            line-height: 1.1;
        }
        .place-city {
            font-size: 22px;
            margin-bottom: 16px;
            display: block;
        }
        .distance {
            font-size: 34px;
            margin-bottom: 12px;
        }
        .date {
            font-size: 26px;
            color: #555;
            margin-bottom: 16px;
        }
        .team {
            font-size: 18px;
            color: #333;
        }
        /* 下方实拍三图横向排列 */
        .photo-row {
            display: flex;
            gap: 12px;
            margin-top: 30px;
        }
        .photo-row img {
            width: calc(100% / 3);
            height: 240px;
            object-fit: cover;
        }
        /* 底部固定蓝条+邮箱 */
        .footer-bar {
            width: 100%;
            height: 4px;
            margin-top: 100px;
        }
        .footer-text {
            text-align: center;
            padding: 24px 0;
            font-size: 16px;
        }
        .footer-text a {
            text-decoration: none;
            color: #002E6D;
        }
        /* 移动端适配 */
        @media (max-width: 900px) {
            .hiking-card {
                grid-template-columns: 1fr;
            }
            .year-sidebar { width: 60px; }
            .year-item { font-size: 20px; }
            .place-name { font-size: 32px; }
            .photo-row { flex-direction: column; }
            .photo-row img { width: 100%; }
        }
    </style>
</head>
<body>
    <!-- 顶部全站统一导航栏 -->
    <div class="top-bar deep-blue-bg">
        <div class="page-title">Hobby</div>
        <div class="nav-middle">
            <a href="hiking.html" class="nav-item nav-active">徒步</a>
            <span class="divider">｜</span>
            <a href="badminton.html" class="nav-item">羽毛球</a>
            <span class="divider">｜</span>
            <a href="photo.html" class="nav-item">摄影</a>
        </div>
        <a href="index.html" class="home-link">Home</a>
    </div>

    <div class="page-wrap">
        <!-- 右侧竖排年份导航 -->
        <div class="year-sidebar">
            <a href="hiking-2026.html" class="year-item year-active">2026</a>
            <a href="hiking-2025.html" class="year-item">2025</a>
            <a href="hiking-2024.html" class="year-item">2024</a>
        </div>

        <!-- 中间主内容 -->
        <div class="main-content">
            <!-- 单条徒步记录卡片 可复制新增多条 -->
            <div class="hiking-card">
                <div class="map-box">
                    <!-- 替换你的轨迹截图 -->
                    <img src="map-xishan.jpg" alt="西山画马轨迹地图">
                </div>
                <div class="text-area">
                    <h2 class="place-name">西山画马 <span class="place-city">北京·西山</span></h2>
                    <div class="distance">20km</div>
                    <div class="date">03-15</div>
                    <div class="team">北京师范大学绿色营地户外协会</div>
                </div>
            </div>

            <!-- 实拍照片行 -->
            <div class="photo-row">
                <img src="pic1.jpg" alt="山野花树">
                <img src="pic2.jpg" alt="乡间土狗">
                <img src="pic3.jpg" alt="阶梯玩偶">
            </div>

            <!-- 底部分割蓝线 -->
            <div class="footer-bar deep-blue-bg"></div>
            <div class="footer-text">
                Email: <a href="mailto:leiai@mail.bnu.edu.cn">leiai@mail.bnu.edu.cn</a>
            </div>
        </div>
    </div>
</body>
</html>
